<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src ws://127.0.0.1:*">
<title>Crystal</title>
<link rel="stylesheet" href="ball.css">
</head>
<body>
  <video id="screenVideo" muted playsinline></video>
  <div id="stage">
    <canvas id="glass"></canvas>
    <div id="ballHit" title="Click to talk · drag to move · right-click for menu"></div>
    <div id="badge" hidden></div>

    <section id="panel" hidden>
      <div id="panelClip"><canvas id="panelBackdrop"></canvas></div>
      <div id="panelTint"></div>
      <div id="messages" aria-live="polite"></div>
      <div id="notice" hidden></div>
      <div id="confirm" hidden>
        <span id="confirmText"></span>
        <button id="allowBtn" type="button">Allow</button>
        <button id="denyBtn" type="button">Deny</button>
      </div>
      <div id="pickers"><div id="provChips" class="chips"></div><div id="effortChips" class="chips"></div></div>
      <form id="composer" autocomplete="off">
        <input id="input" type="text" spellcheck="false">
        <button id="micBtn" type="button" hidden aria-label="Start voice input" title="Start voice input"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11Z"/></svg></button>
        <button id="stopBtn" type="button" hidden aria-label="Stop">Stop</button>
      </form>
    <!-- Floating quick-action buttons beside the chat dialog -->
    <section id="floatPanel" hidden>
      <button id="floatModel" type="button" title="Model provider (Ollama / OpenRouter / OpenAI-compatible)">
        <span class="ic">M</span><span class="lab">Model provider</span>
      </button>
      <button id="floatWorkspace" type="button" title="Workspaces (switch the folder Crystal can access)">
        <span class="ic">W</span><span class="lab">Workspaces</span>
      </button>
      <div id="floatMenu" class="floatMenu"></div>
      <div id="floatToast" class="floatToast"></div>
    </section>
    </section>
  </div>
  <script src="stt.js"></script>
  <script src="ball.js"></script>
</body>
</html>
